<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>a little pause 🫧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1B1420;
      --ink-card: #251A2C;
      --ink-card-2: #2E1F37;
      --rose: #F0A8C4;
      --rose-deep: #E36F9C;
      --crimson: #7C2A3B;
      --gold: #C9A66B;
      --text-primary: #F3E9EE;
      --text-secondary: #B9A6B8;
      --text-muted: #8A7A8C;
      --grad-1: rgba(240, 168, 196, 0.10);
      --grad-2: rgba(124, 42, 59, 0.25);
      --grad-3: rgba(201, 166, 107, 0.08);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --ink: #FAF3F5;
        --ink-card: #FFFFFF;
        --ink-card-2: #FDF7F9;
        --rose: #D87B9F;
        --rose-deep: #C15781;
        --crimson: #8C374A;
        --gold: #B89254;
        --text-primary: #3A2A30;
        --text-secondary: #6A5B60;
        --text-muted: #9A8A92;
        --grad-1: rgba(216, 123, 159, 0.15);
        --grad-2: rgba(140, 55, 74, 0.10);
        --grad-3: rgba(184, 146, 84, 0.10);
      }
    }

    * {
      box-sizing: border-box;
      touch-action: none; /* Prevents zooming/scrolling on mobile to keep it like a game */
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Lock the screen */
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background:
        radial-gradient(circle at 20% 5%, var(--grad-1) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, var(--grad-2) 0%, transparent 45%),
        radial-gradient(circle at 50% 95%, var(--grad-3) 0%, transparent 50%),
        var(--ink);
      color: var(--text-primary);
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .back-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--rose);
      border-radius: 30px;
      background: rgba(240, 168, 196, 0.1);
      color: var(--rose);
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .title-box {
      pointer-events: auto;
      text-align: right;
    }

    .title-box h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--rose-deep);
    }

    .title-box p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
  </style>
</head>

<body>
  <div class="ui-layer">
    <a href="index.html" class="back-btn">← go back</a>
    <div class="title-box">
      <h1>pop & breathe</h1>
      <p>tap to clear your mind</p>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Theming colors to match the app
    const getThemeColors = () => {
      const isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      return {
        bg: isLight ? '#FAF3F5' : '#1B1420',
        bubbles: isLight ? ['#D87B9F', '#C15781', '#8C374A', '#B89254'] : ['#F0A8C4', '#E36F9C', '#7C2A3B', '#C9A66B'],
        grad1: isLight ? 'rgba(216, 123, 159, 0.15)' : 'rgba(240, 168, 196, 0.10)',
        grad2: isLight ? 'rgba(140, 55, 74, 0.10)' : 'rgba(124, 42, 59, 0.25)',
        grad3: isLight ? 'rgba(184, 146, 84, 0.10)' : 'rgba(201, 166, 107, 0.08)'
      };
    };

    let colors = getThemeColors();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      colors = getThemeColors();
    });

    // Audio setup (soft synthesized plop)
    let audioCtx;
    const initAudio = () => {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Audio not supported', e);
      }
    };

    const playPopSound = () => {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime); // randomize pitch slightly
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // Soft volume
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    };

    // Game Entities
    let bubbles = [];
    let particles = [];

    class Bubble {
      constructor() {
        this.radius = Math.random() * 20 + 25; // 25 to 45
        this.x = Math.random() * (width - this.radius * 2) + this.radius;
        this.y = height + this.radius;
        this.speed = Math.random() * 1.5 + 0.5;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.03 + 0.01;
        this.color = colors.bubbles[Math.floor(Math.random() * colors.bubbles.length)];
        this.popped = false;
        this.alpha = 0; // fade in
      }

      update() {
        this.y -= this.speed;
        this.wobble += this.wobbleSpeed;
        if (this.alpha < 0.8) this.alpha += 0.02;
        
        // Wobble effect
        this.renderX = this.x + Math.sin(this.wobble) * 15;
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.renderX, this.y, this.radius, 0, Math.PI * 2);
        
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha * 0.3; // soft fill
        ctx.fill();
        
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = this.alpha * 0.8;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
        
        // Tiny highlight
        ctx.beginPath();
        ctx.arc(this.renderX - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = this.alpha * 0.5;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.color = color;
        this.alpha = 1;
        this.life = Math.random() * 0.02 + 0.01;
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05; // tiny gravity
        this.alpha -= this.life;
      }
      
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // Interaction
    const handlePop = (clientX, clientY) => {
      initAudio(); // Initialize audio on first interaction
      
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dx = b.renderX - clientX;
        const dy = b.y - clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < b.radius + 10) { // +10 for generous hitbox on mobile
          // Pop it!
          playPopSound();
          
          // Create particles
          for(let p = 0; p < 12; p++) {
            particles.push(new Particle(b.renderX, b.y, b.color));
          }
          
          bubbles.splice(i, 1);
          break; // Only pop one per tap
        }
      }
    };

    // Touch events for mobile on CANVAS only
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault(); // stop scrolling
      for(let i=0; i<e.touches.length; i++) {
        handlePop(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: false });
    
    canvas.addEventListener('mousedown', (e) => {
      handlePop(e.clientX, e.clientY);
    });

    // Game Loop
    let frameCount = 0;
    function loop() {
      // Draw gradient background manually since alpha is false for performance
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, width, height);
      
      const grad1 = ctx.createRadialGradient(width*0.2, height*0.05, 0, width*0.2, height*0.05, width*0.45);
      grad1.addColorStop(0, colors.grad1);
      grad1.addColorStop(1, 'transparent');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, width, height);

      const grad2 = ctx.createRadialGradient(width*0.85, height*0.2, 0, width*0.85, height*0.2, width*0.45);
      grad2.addColorStop(0, colors.grad2);
      grad2.addColorStop(1, 'transparent');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, width, height);

      // Spawn bubbles
      frameCount++;
      if (frameCount % 40 === 0 && bubbles.length < 15) {
        bubbles.push(new Bubble());
      }

      // Update and draw bubbles
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.draw(ctx);
        if (b.y < -b.radius) {
          bubbles.splice(i, 1); // remove if off screen top
        }
      }

      // Update and draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }
    
    loop();
  </script>
</body>

</html>
