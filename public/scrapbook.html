<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Scrapbook</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcf8f9;
      --text-primary: #2d2a2b;
      --text-secondary: #7e7376;
      --rose: #d495a6;
      --rose-deep: #b56c80;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-primary);
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      z-index: 10;
      padding: 10px;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--rose-deep);
      margin-bottom: 2rem;
      position: absolute;
      top: 30px;
      text-align: center;
      width: 100%;
      z-index: 0;
    }
    
    .book-container {
      position: relative;
      width: 85vw;
      max-width: 400px;
      height: 60vh;
      perspective: 1500px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2rem;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 8px 16px 16px 8px;
      box-shadow: inset 4px 0 10px rgba(0,0,0,0.1), 0 10px 30px rgba(0,0,0,0.1);
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .page-front {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: white;
      border-radius: 8px 16px 16px 8px;
    }
    
    .page.flipped {
      transform: rotateY(-180deg);
    }

    .page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #fafafa;
      transform: rotateY(180deg);
      backface-visibility: hidden;
      border-radius: 16px 8px 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      color: var(--rose);
      font-size: 1.2rem;
      box-shadow: inset -4px 0 10px rgba(0,0,0,0.1);
    }

    /* Stack depth illusion */
    .page:nth-child(1) { z-index: 5; }
    .page:nth-child(2) { z-index: 4; }
    .page:nth-child(3) { z-index: 3; }
    .page:nth-child(4) { z-index: 2; }
    .page:nth-child(5) { z-index: 1; }

    .photo-frame {
      width: 100%;
      height: 70%;
      background: #eee;
      border: 8px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 1rem;
      object-fit: cover;
    }
    
    .caption {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      text-align: center;
      color: var(--text-primary);
      margin: 0;
    }
    
    .controls {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 2rem;
      z-index: 10;
    }
    
    .control-btn {
      background: var(--rose-deep);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(181, 108, 128, 0.3);
      transition: transform 0.2s;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    .control-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <button class="back-btn" onclick="window.location.href='index.html'">←</button>
  <h1 class="title">Our Scrapbook</h1>

  <div class="book-container" id="book">
    <div class="page" id="page-1">
      <div class="page-front">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800" class="photo-frame" alt="Memory">
        <p class="caption">"Our very first chapter."</p>
      </div>
      <div class="page-back">keep going ✨</div>
    </div>
    
    <div class="page" id="page-2">
      <div class="page-front">
        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800" class="photo-frame" alt="Memory">
        <p class="caption">"Lost in our own little world."</p>
      </div>
      <div class="page-back">almost there 💫</div>
    </div>
    
    <div class="page" id="page-3">
      <div class="page-front">
        <img src="https://images.unsplash.com/photo-1501901609772-df0848060b33?auto=format&fit=crop&w=800" class="photo-frame" alt="Memory">
        <p class="caption">"Every moment with you is magic."</p>
      </div>
      <div class="page-back">I love you 🌙</div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="prevBtn" onclick="prevPage()" disabled>Previous</button>
    <button class="control-btn" id="nextBtn" onclick="nextPage()">Next</button>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 3;

    function updateButtons() {
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage > totalPages);
    }

    function nextPage() {
      if (currentPage <= totalPages) {
        document.getElementById(`page-${currentPage}`).classList.add('flipped');
        currentPage++;
        updateButtons();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        document.getElementById(`page-${currentPage}`).classList.remove('flipped');
        updateButtons();
      }
    }
  </script>
</body>
</html>
