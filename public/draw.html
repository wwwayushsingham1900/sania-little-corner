<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>your sketchbook 🎨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1B1420;
      --ink-card: #251A2C;
      --rose: #F0A8C4;
      --rose-deep: #E36F9C;
      --gold: #C9A66B;
      --text-primary: #F3E9EE;
      --text-secondary: #B9A6B8;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --ink: #FAF3F5;
        --ink-card: #FFFFFF;
        --rose: #D87B9F;
        --rose-deep: #C15781;
        --gold: #B89254;
        --text-primary: #3A2A30;
        --text-secondary: #6A5B60;
      }
    }

    * {
      box-sizing: border-box;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: var(--ink);
      color: var(--text-primary);
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--rose);
      border-radius: 30px;
      background: rgba(240, 168, 196, 0.1);
      color: var(--rose);
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
      backdrop-filter: blur(4px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .title-box {
      text-align: right;
    }

    .title-box h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--rose-deep);
    }

    .title-box p {
      margin: 0.2rem 0 0;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .tools-bar {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      pointer-events: auto;
      background: var(--ink-card);
      padding: 0.8rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(240, 168, 196, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin: 0 auto;
      width: max-content;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      justify-content: space-between;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .color-btn.active {
      transform: scale(1.2);
      border-color: var(--text-primary);
    }

    /* Custom Color Picker input hidden over a rainbow button */
    .custom-color-wrapper {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease;
    }

    .custom-color-wrapper.active {
      transform: scale(1.2);
      border-color: var(--text-primary);
    }

    .custom-color-wrapper input[type="color"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
    }

    .action-btn:active {
      color: var(--rose-deep);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--text-secondary);
      opacity: 0.3;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100px;
      height: 4px;
      background: var(--rose);
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-primary);
      cursor: pointer;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>

<body>
  <div class="ui-layer">
    <div class="top-bar">
      <a href="index.html" class="btn">← go back</a>
      <div class="title-box">
        <h1>glowing canvas</h1>
        <p>draw & color whatever you feel</p>
      </div>
    </div>
    
    <div class="tools-bar">
      <div class="row">
        <!-- Preset Colors -->
        <div class="color-btn active preset-color" style="background: #F0A8C4;" data-color="#F0A8C4"></div>
        <div class="color-btn preset-color" style="background: #C9A66B;" data-color="#C9A66B"></div>
        <div class="color-btn preset-color" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
        <div class="color-btn preset-color" style="background: #7C2A3B;" data-color="#7C2A3B"></div>
        <div class="color-btn preset-color" style="background: #4A90E2;" data-color="#4A90E2"></div>
        
        <!-- Any Color Picker -->
        <div class="custom-color-wrapper" id="customColorBtn">
          <input type="color" id="colorPicker" value="#00ff00">
        </div>
      </div>
      
      <div class="row" style="justify-content: center; gap: 1rem;">
        <!-- Brush Size / Coloring -->
        <div class="slider-container">
          <span>pen</span>
          <input type="range" id="sizeSlider" min="2" max="40" value="6">
          <span>color</span>
        </div>
        
        <div class="divider"></div>
        
        <button class="action-btn" id="clearBtn">clear</button>
        <button class="action-btn" id="saveBtn">save photo 📸</button>
      </div>
    </div>
  </div>

  <canvas id="drawCanvas"></canvas>

  <script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let strokeColor = '#F0A8C4';
    let brushSize = 6;
    let points = [];

    const getGlowColor = (hex) => {
      // Just return the same color for glow to simplify custom colors, it still looks great
      return hex;
    };

    // Setup Canvas
    const resize = () => {
      const imgData = canvas.width ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      ctx.fillStyle = window.matchMedia('(prefers-color-scheme: light)').matches ? '#FAF3F5' : '#1B1420';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      if (imgData) {
        ctx.putImageData(imgData, 0, 0);
      }
    };
    
    window.addEventListener('resize', resize);
    resize();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', resize);

    // Drawing Logic
    const startDrawing = (e) => {
      isDrawing = true;
      const { x, y } = getCoordinates(e);
      lastX = x;
      lastY = y;
      points = [{ x, y }];
      
      // Draw a dot on tap
      ctx.beginPath();
      ctx.fillStyle = strokeColor;
      ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
      ctx.fill();
    };

    const draw = (e) => {
      if (!isDrawing) return;
      const { x, y } = getCoordinates(e);
      
      points.push({ x, y });
      
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = brushSize;
      ctx.strokeStyle = strokeColor;
      ctx.shadowBlur = Math.min(15, brushSize * 1.5);
      ctx.shadowColor = getGlowColor(strokeColor);

      ctx.lineTo(x, y);
      ctx.stroke();

      lastX = x;
      lastY = y;
    };

    const stopDrawing = () => {
      isDrawing = false;
      points = [];
      ctx.beginPath();
    };

    const getCoordinates = (e) => {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    };

    // Event Listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    // Tools setup
    const presetBtns = document.querySelectorAll('.preset-color');
    const customColorBtn = document.getElementById('customColorBtn');
    const colorPicker = document.getElementById('colorPicker');
    
    function deactivateAllColors() {
      presetBtns.forEach(b => b.classList.remove('active'));
      customColorBtn.classList.remove('active');
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        deactivateAllColors();
        btn.classList.add('active');
        strokeColor = btn.dataset.color;
      });
    });

    colorPicker.addEventListener('input', (e) => {
      deactivateAllColors();
      customColorBtn.classList.add('active');
      strokeColor = e.target.value;
    });

    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value, 10);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.fillStyle = window.matchMedia('(prefers-color-scheme: light)').matches ? '#FAF3F5' : '#1B1420';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    // Save to Gallery via Web Share API
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const dataUrl = canvas.toDataURL('image/png');
      
      try {
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], 'my_canvas_sketch.png', { type: 'image/png' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          // Opens native share sheet (where user can tap "Save Image")
          await navigator.share({
            files: [file],
            title: 'My Glowing Sketch',
          });
        } else {
          // Fallback for desktop or non-supported browsers
          const link = document.createElement('a');
          link.download = 'my_canvas_sketch.png';
          link.href = dataUrl;
          link.click();
        }
      } catch (err) {
        console.error('Share failed', err);
        // Direct download fallback
        const link = document.createElement('a');
        link.download = 'my_canvas_sketch.png';
        link.href = dataUrl;
        link.click();
      }
    });
  </script>
</body>

</html>
